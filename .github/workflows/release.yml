name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore Dependencies
        run: dotnet restore BedrockInventoryEditor.csproj

      - name: Build Application (Release)
        run: dotnet build BedrockInventoryEditor.csproj -c Release --no-restore

      - name: Publish Framework-Dependent Build (win-x64)
        run: >
          dotnet publish BedrockInventoryEditor.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o ./publish/BedrockInventoryEditor-win-x64

      - name: Publish Standalone Self-Contained Build (win-x64)
        run: >
          dotnet publish BedrockInventoryEditor.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish/BedrockInventoryEditor-Standalone-win-x64

      - name: Create Zip Archives
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ github.event.inputs.tag_name }}' } else { '${{ github.ref_name }}' }
          New-Item -ItemType Directory -Force -Path ./dist
          
          Compress-Archive -Path ./publish/BedrockInventoryEditor-win-x64/* -DestinationPath "./dist/BedrockInventoryEditor-$tag-win-x64.zip"
          Compress-Archive -Path ./publish/BedrockInventoryEditor-Standalone-win-x64/* -DestinationPath "./dist/BedrockInventoryEditor-$tag-Standalone-win-x64.zip"
          
          Copy-Item ./publish/BedrockInventoryEditor-Standalone-win-x64/BedrockInventoryEditor.exe -Destination "./dist/BedrockInventoryEditor-$tag-Standalone.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Minecraft Bedrock Inventory Editor ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.zip
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
